[project]
name = "rocket-propulsion-simulator"
version = "2.2.0"
description = "Web application for internal-ballistics simulation of solid rocket motors (chamber pressure and thrust)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Marko Šterk", email = "marko_sterk@hotmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-image>=0.21",
    "pillow>=9.1",
]

[dependency-groups]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.6"]

[tool.uv]
package = false
